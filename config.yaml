advanced:
  file_workers: 0

  lcp: ./tools/LCP/build/bin/lcp
  xnyzip: ./tools/XnYZip/build/XnYZip

  abs_eb: null
  rel_eb: 1e-3
  pos_abs_eb: null
  pos_rel_eb: null
  vel_abs_eb: null
  vel_rel_eb: null
  vel_chunk_size: 0
  vel_chunk_workers: 0
  id_abs_eb: 0.0

  pos_compressor: xnyzip #szo for HM
  vel_compressor: szo
  lossless: pcodec
  pcodec_level: 12

  lattice_layout: false #true for szo positions in HM
  lattice_min_occupancy: 0.8
  lattice_axis_search: true

  xnyzip_structure_aware: false
  xnyzip_velocity_cell_bits: 7

  xnyzip_tie_sort: true #false if xnyzip not used (in HM)

  xnyzip_linf_bound: false #true if want to use XnYZip's Linf bound, otherwise default L2 bound for position would be kept.

  position_scale: auto
  position_scale_attr: bitwidth
  position_scale_value: null
